korppi_engine = { path = "../../crates/engine" }
korppi_render = { path = "../../crates/render" }
korppi_window = { path = "../../crates/window" }
korppi_input = { path = "../../crates/input" }
korppi_ui = { path = "../../crates/ui" }
tracing = { workspace = true }
