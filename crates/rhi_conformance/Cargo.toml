[package]
name = "korppi_rhi_conformance"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Cross-backend conformance harness and regression suite for korppi_rhi backends"
publish = false

[dependencies]
korppi_rhi = { path = "../rhi", features = ["serde"] }
korppi_rhi_opengl = { path = "../rhi_opengl" }
korppi_rhi_vulkan = { path = "../rhi_vulkan" }
raw-window-handle = { workspace = true }

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = { workspace = true }
wayland-client = { workspace = true }
wayland-protocols = { workspace = true }

[lints]
workspace = true
